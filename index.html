<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="error.svg">
    <title>Website offline</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #400000;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Wellenhintergrund */
        .wave-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #400000, #c90000);
            z-index: -1;
        }

        .wave-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(rgba(0, 0, 0, 0.1) 1px, transparent 1px),
                        radial-gradient(rgba(0, 0, 0, 0.1) 1px, transparent 1px);
            background-size: 50px 50px, 50px 50px;
            background-position: 25px 25px, 0 0;
            z-index: -1;
            opacity: 0.3; /* Halbtransparent */
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        .icon {
            font-size: 100px;
            margin-bottom: 20px;
        }

        .icon img {
            width: 120px;
        }

        h1 {
            font-size: 36px;
            margin: 10px 0;
        }

        p {
            font-size: 18px;
            margin: 10px 0 20px;
        }

        .home-button {
            text-decoration: none;
            background-color: #ff4c4c;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            transition: background-color 0.3s;
        }

        .home-button:hover {
            background-color: #ff2c2c;
        }
    </style>
</head>
<body>
    <div class="wave-background"></div>
    <div class="wave-pattern"></div>
    <div class="container">
        <div class="icon">
            <img src="error.svg" alt="Error Icon"> <!-- Ersetze dies mit deinem Symbol -->
        </div>
        <h1>Offline</h1>
        <p>The TheROcraft Website is currently offline</p>
        <a href="https://trc-production-studios.com" class="home-button">TRC Production Studios</a>
    </div>
</body>
</html>
